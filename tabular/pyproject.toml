[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-engine"
version = "0.1.0"
description = "Automated machine learning for tabular classification and regression on scikit-learn: guardrails, leakage detection, tuned + blended leaderboards, honest holdout evaluation, deployable artifacts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NoLogLeftBehind-AI" }]
keywords = ["automl", "machine-learning", "scikit-learn", "tabular-data",
            "hyperparameter-tuning", "model-selection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.6,<2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/NoLogLeftBehind-AI/automl-lab"
Homepage = "https://github.com/NoLogLeftBehind-AI/automl-lab"

[project.optional-dependencies]
# model libraries the engine uses when present (it degrades gracefully without)
full = [
    "xgboost>=2.0",
    "lightgbm>=4.2",
    "catboost>=1.2",
    "optuna>=3.5",
    "shap>=0.45",
    "pyarrow>=15",
]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
include = ["automl*"]
