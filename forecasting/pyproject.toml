[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autofc"
version = "0.1.0"
description = "Automated time-series forecasting for single- and multi-series panel data: guardrails, seasonal-strength detection, SARIMAX/ETS/Theta/Prophet + global GBM lag models, rolling-origin MASE leaderboards, holiday calendars, hierarchical reconciliation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NoLogLeftBehind-AI" }]
keywords = ["forecasting", "time-series", "automl", "prophet", "sarimax",
            "hierarchical-reconciliation", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/NoLogLeftBehind-AI/automl-lab"
Homepage = "https://github.com/NoLogLeftBehind-AI/automl-lab"

[project.optional-dependencies]
full = [
    "prophet>=1.1.5",
    "lightgbm>=4.2",
    "xgboost>=2.0",
    "holidays>=0.50",
    "pyarrow>=15",
]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
include = ["autofc*"]
